<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Aula Virtual</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .menu-contenedor {
            display: flex;
            gap: 20px;
        }

        /* Estilo para convertir los enlaces en botones atractivos */
        .btn-navegacion {
            background-color: #4caf50;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-navegacion:hover {
            background-color: #388e3c;
            transform: translateY(-2px);
        }

        .btn-navegacion.secundario {
            background-color: #2196f3;
        }

        .btn-navegacion.secundario:hover {
            background-color: #1976d2;
        }
    </style>
</head>
<body>

    <h1>Selecciona una opción</h1>

    <div class="menu-contenedor">
        <!-- Enlace 1 hacia la Ruleta -->
        <a href="Ruleta.html" class="btn-navegacion">Ir a la Ruleta</a>
        
        <!-- Enlace 2 hacia el Sorteo -->
        <a href="sorteo.html" class="btn-navegacion secundario">Ir al Sorteo</a>
    </div>

</body>
</html>
